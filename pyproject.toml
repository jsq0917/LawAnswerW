[project]
name = "lawanswer"
version = "0.1.0"
description = "LawAnswer —— 面向法律条文的多路 RAG 问答系统"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    "redis>=5.2.0",
    "pymilvus>=2.5.4,<2.6",
    "httpx>=0.27.2",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "pillow>=11.0.0",
    "huggingface-hub>=0.26.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "flagembedding>=1.4.2",
    "pymupdf>=2.0",
    "python-pptx>=1.0.2",
    "python-multipart>=0.0.32",
    "openai>=1.54.0",
]

[dependency-groups]
# 单元测试全离线：不加载真实模型、不调 DashScope、不连数据库
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pyyaml>=6.0.2",
]
# 评估依赖单独隔离（ragas 与 langchain 版本强绑定，装进主依赖会污染 FastAPI/pydantic 环境）：
# uv sync --group eval
eval = [
    "ragas==0.3.0",
    "langchain-community==0.4.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "datasets>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "config.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "integration: 需要本机 MySQL/Redis/Milvus 已启动（默认跳过，设置 RUN_INTEGRATION=1 启用）",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[project]
name = "lawanswer"
version = "0.1.0"
description = "LawAnswer —— 面向法律条文的多路 RAG 问答系统"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    "redis>=5.2.0",
    "pymilvus>=2.5.4,<2.6",
    "httpx>=0.27.2",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "pillow>=11.0.0",
    "huggingface-hub>=0.26.0",
    # 上界锁到 2.14.x：保证 Windows 侧解析到 2.14.1+cu130 时，
    # Linux/macOS 侧也是同一源码版本的 2.14.1，避免两端 torch 版本分叉。
    "torch>=2.14.1,<2.15",
    "transformers>=5.20.2",
    "flagembedding>=1.4.2",
    "pymupdf>=2.0",
    "python-pptx>=1.0.2",
    "python-multipart>=0.0.32",
    "openai>=1.54.0",
]

[dependency-groups]
# 单元测试全离线：不加载真实模型、不调 DashScope、不连数据库
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pyyaml>=6.0.2",
]
# 评估依赖单独隔离（ragas 与 langchain 版本强绑定，装进主依赖会污染 FastAPI/pydantic 环境）：
# uv sync --group eval
eval = [
    "ragas==0.3.0",
    "langchain-community==0.4.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "datasets>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "config.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "integration: 需要本机 MySQL/Redis/Milvus 已启动（默认跳过，设置 RUN_INTEGRATION=1 启用）",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# ─────────────────────────────────────────────────────────────────────────────
# GPU 版 torch：从 PyTorch 官方 cu130 索引取轮子
# ─────────────────────────────────────────────────────────────────────────────
# 背景：PyPI（含阿里云 PyPI 镜像）上 Windows 平台的 torch 默认分发 CPU 构建，
#       `uv add torch` / `pip install torch` 只会得到 `+cpu`，
#       torch.cuda.is_available() 恒为 False。带 CUDA 的 Windows 轮子只发布在
#       PyTorch 专用索引上。
#
# 用法：`uv lock` → `uv sync`，自动装 GPU 版，不再需要记忆
#       `uv sync --no-install-package torch` 这类手工旁路（旧做法已废弃）。
#
# 跨平台：源用 marker 限定为 Windows，Linux/macOS 解析不受影响。
#       若 Linux CI 也要 GPU，追加一条 sys_platform == 'linux' 的源即可。
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true   # 只在本文件显式引用时才用，不污染其它包的解析

[tool.uv.sources]
# 对 torch 的**所有**需求——含 flagembedding / sentence-transformers 的传递依赖——
# 都走 cu130 索引，避免传递依赖从主索引再解析出一个 CPU 版。
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

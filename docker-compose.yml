# ============================================================================
# LawAnswer 基础设施（只跑存储，不跑应用）
#
#   docker compose up -d          # 启动 MySQL / Redis / Milvus / MinIO
#   docker compose ps             # 查看状态（三个 healthy 才算就绪）
#   docker compose down           # 停止（数据保留在 ./volumes）
#   docker compose down -v        # 连数据一起清掉（慎用）
#
# 端口全部偏移，避免与本机 shopmate 项目（19530/6379/9000/5432）冲突：
#   MySQL  3307   Redis 6380   Milvus 19531(9092)   MinIO 9002(9003)
#
# 密码从 .env 读取（compose 会自动加载同目录 .env），不要在这里写死。
# 镜像本地已有，无需联网拉取。
# ============================================================================
name: lawanswer

services:
  mysql:
    container_name: lawanswer-mysql
    image: mysql:8.0.43
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --ngram_token_size=2
      - --max_connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pwd}
      MYSQL_DATABASE: lawanswer
      MYSQL_USER: lawanswer
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lawanswer_dev_pwd}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - ./volumes/mysql:/var/lib/mysql
      # 首次初始化（数据目录为空）时自动执行建表脚本
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    container_name: lawanswer-redis
    image: redis:7.2
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  etcd:
    container_name: lawanswer-etcd
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 6

  minio:
    container_name: lawanswer-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9002:9000"   # S3 API
      - "9003:9001"   # 控制台
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 6

  milvus:
    container_name: lawanswer-milvus
    image: milvusdb/milvus:v2.4.4
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19531:19530"  # gRPC
      - "9092:9091"    # metrics / healthz
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

# ============================================================================
# LawAnswer HTTPS 站点（443）—— 宝塔环境
#
# 放置位置：/www/server/panel/vhost/nginx/lawanswer-ssl.conf
# 与 nginx-lawanswer.conf 并存（后者只管 80）。语法检查：
#   /www/server/nginx/sbin/nginx -t && /www/server/nginx/sbin/nginx -s reload
#
# 证书来源：acme.sh + Let's Encrypt，**DNS-01 手动验证**
#   为什么不走 HTTP-01：本机 80 端口被云厂商 ICP 备案拦截，
#   未备案域名的 HTTP 请求会在入口被打回 403（页面标题 Non-compliance ICP Filing），
#   Let's Encrypt 的 HTTP 校验必然失败。443 不受该拦截影响（实测握手正常），
#   所以只能用 DNS-01 证明域名归属。
#
# 签发命令（在服务器上，root）：
#   export LE_CONFIG_HOME=/root/.acme.sh
#   # 第一步：生成 TXT 记录（会失败，属正常，输出里含待添加的记录）
#   /root/.acme.sh/acme.sh --issue --server letsencrypt --dns \
#       -d <YOUR_DOMAIN> -d www.<YOUR_DOMAIN> \
#       --yes-I-know-dns-manual-mode-enough-go-ahead-please
#   # 第二步：把输出里的 TXT 记录加到阿里云 DNS（_acme-challenge / _acme-challenge.www）
#   # 第三步：记录生效后完成签发
#   /root/.acme.sh/acme.sh --renew -d <YOUR_DOMAIN> \
#       --yes-I-know-dns-manual-mode-enough-go-ahead-please
#
# 证书落地：/etc/lawanswer/ssl/{fullchain.pem,privkey.pem}（privkey 600）
#   cp /root/.acme.sh/<YOUR_DOMAIN>_ecc/fullchain.cer /etc/lawanswer/ssl/fullchain.pem
#   cp /root/.acme.sh/<YOUR_DOMAIN>_ecc/<YOUR_DOMAIN>.key /etc/lawanswer/ssl/privkey.pem
#
# 续期提醒：**手动 DNS 模式不能自动续期**，有效期 90 天。
#   到期前 30 天回到上面第一步，重新生成 TXT 记录再签一次。
#   备案通过后可改用 HTTP-01（webroot）实现自动续期，届时删掉本文件的证书路径指向即可。
#
# 刻意没加 HSTS：手动续期一旦失败，HSTS 会让浏览器硬性拒绝访问且无法绕过。
#   等切换到自动续期后再考虑加 add_header Strict-Transport-Security。
# ============================================================================
server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  <YOUR_DOMAIN> www.<YOUR_DOMAIN>;

    ssl_certificate      /etc/lawanswer/ssl/fullchain.pem;
    ssl_certificate_key  /etc/lawanswer/ssl/privkey.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    root  /opt/lawanswer/frontend/dist;
    index index.html;

    access_log /www/wwwlogs/lawanswer.access.log;
    error_log  /www/wwwlogs/lawanswer.error.log;

    client_max_body_size 50m;

    # ---------- 接口文档：只给本机 ----------
    # 必须先于下面的 `location /`（SPA 回退）。否则 /docs、/redoc、/openapi.json 会命中
    # try_files ... /index.html，浏览器打开"文档"看到的是前端对话页：既拿不到文档，
    # 也看不出是 404。生产环境不对外暴露 schema（含全部路由、参数、鉴权方式），只留本机自检。
    location ~ ^/(docs|redoc|openapi\.json)$ {
        allow 127.0.0.1;
        allow ::1;
        deny  all;

        proxy_pass         http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 入库 / 评测接口：仅本机。正则 location 会覆盖 /api/ 前缀规则，必须重复写代理参数
    location ~ ^/api/(ingest|eval)(/|$) {
        allow 127.0.0.1; allow ::1; deny all;
        proxy_pass         http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 后端 API：SSE 流式必须关缓冲
    location /api/ {
        proxy_pass         http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    # Vue history 路由刷新不 404
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-store, no-cache, must-revalidate"; }

    gzip on; gzip_min_length 1k; gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}

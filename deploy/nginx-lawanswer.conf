# ============================================================================
# LawAnswer Nginx 站点配置
# 放置位置：/etc/nginx/conf.d/lawanswer.conf
#
# 覆盖三件事：
#   1) 静态托管前端 dist（Vue3 history 路由，刷新不 404）
#   2) 反代 /api → FastAPI:8101，且对 SSE 关闭缓冲（否则流式变"憋一大坨"）
#   3) 80 → 443 跳转 + Let's Encrypt 证书挂载
#
# 【首次部署顺序】先只在 server_name 生效的情况下用 80 跑通（见下方提示），
# 证书签发成功后再启用 443 与跳转。
#
# 把 lawanswer.example.com 全部替换为你的备案域名。
# ============================================================================

upstream lawanswer_api {
    server 127.0.0.1:8101;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# 80：ACME 校验 + 跳转 HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name lawanswer.example.com;

    # certbot webroot 校验目录（签发/续期时会往这里写文件）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 【首签证书之前】把下面三行注释掉，先让 http 能直接访问站点，
    # 确认后端与静态页都正常，再签证书。
    # 【证书就绪后】取消注释，全站强制 HTTPS。
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 443：正式服务
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lawanswer.example.com;

    # 证书路径由 certbot 生成
    ssl_certificate     /etc/letsencrypt/live/lawanswer.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lawanswer.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上传 PDF / PPTX 需要放大请求体上限（默认 1M 会 413）
    client_max_body_size 50m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------- 前端静态资源 ----------
    root /opt/lawanswer/frontend/dist;
    index index.html;

    # index.html 必须不缓存，否则发版后用户仍加载旧资源清单
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 带哈希的静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 后端 API + SSE ----------
    # 注意 location 用 /api/ 前缀，proxy_pass 结尾不带斜杠，
    # 这样 /api/chat/stream 原样透传给 8101，不做路径重写。
    location /api/ {
        proxy_pass http://lawanswer_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # keepalive upstream 必需：清空 Connection，否则连接无法复用
        proxy_set_header Connection        "";

        # >>> SSE 关键三行：不关缓冲，流式输出会被 nginx 攒成一次性返回 <<<
        proxy_buffering off;
        proxy_cache off;
        # 告诉上游不要缓冲（FastAPI 侧也有 X-Accel-Buffering 头，双保险）
        proxy_set_header X-Accel-Buffering no;

        # LLM 流式生成最长可能 60s+，读超时给足
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 15s;

        # SSE 必需：不使用 chunked 之外的编码，且禁压缩（压缩会破坏分帧）
        chunked_transfer_encoding on;
        gzip off;
    }

    # 健康检查端点（供阿里云 SLB / 监控探活，不带缓存）
    location = /api/health/live {
        proxy_pass http://lawanswer_api;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- Vue Router history 模式回退 ----------
    # 必需：/chat、/kb/xxx 这类前端路由刷新时服务器上并无对应文件，
    # 没有这行会直接 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
# ============================================================================
# LawAnswer nginx 站点（宝塔面板环境）
#
# 放置位置：/www/server/panel/vhost/nginx/lawanswer.conf
#   （宝塔主配置 /www/server/nginx/conf/nginx.conf 末尾已 include 该目录）
# 生效：/www/server/nginx/sbin/nginx -t && /www/server/nginx/sbin/nginx -s reload
#
# 每条配置都对应一个真实坑：
#   1. proxy_buffering off   —— SSE 流式必须关缓冲，否则前端要等整段生成完才显示
#   2. try_files /index.html —— Vue history 路由刷新不 404
#   3. client_max_body_size  —— 默认 1m，上传 PDF/Word 直接 413
#   4. index.html 不缓存     —— 发版后立即生效，避免用户拿到旧壳
#   5. /api/ingest|eval 限本机 —— 入库接口无二次鉴权，绝不外放公网
#   6. server_name 含 IP     —— 域名未解析时也能用 IP 直接验证
#
# 公开版说明：真实公网 IP 已替换为 <SERVER_IP>，部署时请替换为你自己的地址。
# ============================================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  <YOUR_DOMAIN> www.<YOUR_DOMAIN> <SERVER_IP>;

    root  /opt/lawanswer/frontend/dist;
    index index.html;

    access_log /www/wwwlogs/lawanswer.access.log;
    error_log  /www/wwwlogs/lawanswer.error.log;

    client_max_body_size 50m;

    # ---------- 域名走 80 一律升级到 https ----------
    # 只能按 $host 精确匹配，不能写成 location / { return 301 }：
    #   * https://<IP> 的证书不含 IP，浏览器在 TLS 阶段就报证书错误，
    #     所以 IP 必须留在 http 上原样服务（curl http://<SERVER_IP>/chat 是排障入口）；
    #   * 备案通过前 80 的域名请求会在云厂商入口被 ICP 拦截，这条暂时到不了 nginx。
    # ACME 的 HTTP-01 校验必须走明文 80，所以 /.well-known/ 永远不跳
    # ——否则备案后改成 webroot 自动续签时会一直失败。
    set $upgrade_https 0;
    if ($host = '<YOUR_DOMAIN>')     { set $upgrade_https 1; }
    if ($host = 'www.<YOUR_DOMAIN>') { set $upgrade_https 1; }
    if ($request_uri ~* "^/\.well-known/") { set $upgrade_https 0; }
    if ($upgrade_https = 1)        { return 301 https://$host$request_uri; }

    # ---------- 接口文档：只给本机（与 443 站点同名规则，见 nginx-lawanswer-ssl.conf） ----------
    # 不加这段，IP 直连的 /docs 会命中 SPA 回退，返回 652 字节的 index.html。
    location ~ ^/(docs|redoc|openapi\.json)$ {
        allow 127.0.0.1;
        allow ::1;
        deny  all;

        proxy_pass         http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------- 入库 / 评测接口：仅本机，且必须继续反代给后端 ----------
    # 注意：该 location 用正则匹配，会覆盖下面的 /api/ 前缀规则，
    # 因此这里必须重复写一遍 proxy_pass 等指令，否则本机请求会落到静态 404。
    location ~ ^/api/(ingest|eval)(/|$) {
        allow 127.0.0.1;
        allow ::1;
        deny  all;

        proxy_pass         http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass         http://127.0.0.1:8101;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE：关缓冲 + 放宽超时
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- 带哈希的静态资源：长缓存 ----------
    location /assets/ {
        expires    30d;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ---------- SPA 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip            on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/javascript application/json
                    application/xml image/svg+xml;
}

